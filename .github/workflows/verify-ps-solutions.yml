name: Verify PS-integrated solutions
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ps_solutions.js'
      - 'scripts/ps_solutions.css'
      - 'scripts/embed_ps_solutions.py'
      - 'scripts/unpack.py'
      - 'scripts/solutions-workspace.js'
      - 'scripts/solutions-workspace.css'
      - 'scripts/solutions-workspace.html'
      - 'scripts/redesign_solutions.py'
      - 'scripts/kla-validators.js'
      - 'scripts/validator-ui.js'
      - 'scripts/validator-ui.css'
      - 'scripts/test-validators.cjs'
      - '.github/workflows/verify-ps-solutions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check scripts/ps_solutions.js
          node --check scripts/solutions-workspace.js
          node --check scripts/kla-validators.js
          node --check scripts/validator-ui.js
          node --check scripts/test-validators.cjs
      - name: Build original site and checked solutions
        run: python3 scripts/unpack.py
      - name: Run custom validator regression suite against all published cases
        run: node scripts/test-validators.cjs build/site
      - name: Assert inline PS solutions and downloadable outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          site=Path('build/site')
          index=(site/'index.html').read_text()
          assert 'ps_solutions.js' in index and 'ps_solutions.css' in index
          assert (site/'ps_solutions.js').is_file()
          assert (site/'ps_solutions.css').is_file()
          manifest=json.loads((site/'solutions/manifest.json').read_text())
          cases=[c for m in manifest['route']['milestones'] for c in m['cases']]
          assert len(cases)==16, len(cases)
          for c in cases:
              assert (site/c['input']).is_file(), c['input']
              assert (site/c['output']).is_file(), c['output']
          assert (site/'solutions/route_solver.py').is_file()
          page=(site/'solutions.html').read_text()
          assert 'solutions-workspace.js' in page
          assert 'solutions-workspace.css' in page
          assert 'problemNav' in page and 'workspace' in page
          assert (site/'solutions-workspace.js').is_file()
          assert (site/'solutions-workspace.css').is_file()
          assert (site/'kla-validators.js').is_file()
          assert (site/'validator-ui.js').is_file()
          assert 'Custom validator' in (site/'solutions-workspace.js').read_text()
          print('PS solutions integration and all 16 output files verified')
          PY
